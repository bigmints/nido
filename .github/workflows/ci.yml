name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + tsc)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (static export)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
