schema = 1
name = "Nido"

[runtime]
kind = "node"
version = "24"
package_manager = "npm"

[[setup.steps]]
kind = "dependencies"
locked = true

[[setup.steps]]
run = ["npm", "run", "build"]

[launch]
command = ["npm", "run", "start", "--", "--listen", "tcp://{host}:{port}", "--no-clipboard"]
host = "127.0.0.1"
port = 4173

[health]
type = "http"
path = "/"
timeout_seconds = 90

[persistence]
# User data lives in browser storage, not repository-relative files.
paths = []
